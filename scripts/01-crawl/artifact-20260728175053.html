<script>globalThis.readonlyFS = {
  async getFile(filename) {
    const script = document.querySelector(`script[type="embedded-file"][filename="${filename}"]`);
    if (!script) {
      throw new Errol(`File not found: ${filename}`);
    }
    const data = script.getAttribute("data");
    // fetch dataUrl into File object
    const blob = await (await fetch(data)).blob();
    const file = new File([blob], filename, { type: blob.type });
    return file;
  },
};

globalThis.writeonlyFS = {
  async writeFile(filename, text) {
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
};

globalThis.llm = {
  async prompt(_prompt) {
    throw new Error(
      "The llm.prompt function is not available in the exported artifact. You can only use it in the runtime environment.",
    );
  },

  async abortAll() {
    // noop
  },
};
</script><script type="module">
    const button = document.querySelector("#start");
    const progress = document.querySelector("#progress");
    const log = document.querySelector("#log");

    const message = (text, error = false) => {
      log.textContent += `\n${text}`;
      (error ? console.error : console.log)(text);
    };

    const safeName = (url, index) => {
      let name = decodeURIComponent(new URL(url).pathname.split("/").pop() || "");
      name = name.replace(/[<>:"/\\|?*\x00-\x1F]/g, "_");
      return `${String(index + 1).padStart(4, "0")}-${name || "image"}`;
    };

    button.addEventListener("click", async () => {
      button.disabled = true;
      log.textContent = "Requesting directory access…";

      try {
        // Called synchronously within the click handler.
        const directoryPromise = window.showDirectoryPicker({ mode: "readwrite" });
        const rxjsPromise = import("https://esm.sh/rxjs@latest");
        const directory = await directoryPromise;
        const { from, mergeMap } = await rxjsPromise;

        message("Loading page…");
        const pageResponse = await fetch("https://stickertop.art/");
        if (!pageResponse.ok) {
          throw new Error(`Page request failed: HTTP ${pageResponse.status}`);
        }

        const document = new DOMParser().parseFromString(
          await pageResponse.text(),
          "text/html"
        );

        const urls = [...document.querySelectorAll("[data-full]")]
          .map(element => element.dataset.full)
          .filter(Boolean)
          .map(url => new URL(url, pageResponse.url).href);

        progress.max = Math.max(urls.length, 1);
        progress.value = 0;
        message(`Found ${urls.length} images.`);

        let completed = 0;

        await new Promise((resolve, reject) => {
          from(urls.map((url, index) => ({ url, index })))
            .pipe(
              mergeMap(async ({ url, index }) => {
                try {
                  const response = await fetch(url);
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);

                  const handle = await directory.getFileHandle(
                    safeName(url, index),
                    { create: true }
                  );
                  const writable = await handle.createWritable();

                  try {
                    await writable.write(await response.blob());
                    await writable.close();
                  } catch (error) {
                    await writable.abort();
                    throw error;
                  }
                } catch (error) {
                  message(`Failed: ${url}\n${error.message}`, true);
                } finally {
                  completed++;
                  progress.value = completed;
                  message(`${completed}/${urls.length} completed`);
                }
              }, 7)
            )
            .subscribe({ complete: resolve, error: reject });
        });

        message("Download finished.");
      } catch (error) {
        message(`Stopped: ${error.message}`, true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
