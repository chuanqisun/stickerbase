name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          sparse-checkout: |
            apps/stickers-web
            data/public.zip
          sparse-checkout-cone-mode: false
      - name: Checkout and extract public assets
        env:
          GIT_TRACE: "1"
          GIT_TRANSFER_TRACE: "1"
          GIT_CURL_VERBOSE: "1"
          GIT_LFS_FORCE_PROGRESS: "1"
          GIT_ATTR_SOURCE: HEAD
        run: |
          set -x
          git lfs version
          git lfs env
          git lfs ls-files --long --size --include="data/public.zip"
          git lfs fetch --include="data/public.zip"
          git config --local lfs.forceprogress true
          echo "Checking out data/public.zip with forced progress output"
          git lfs checkout data/public.zip
          git lfs status
          ls -lh data/public.zip
          unzip -o data/public.zip -d apps/stickers-web/public
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: npm install, build, and test
        working-directory: apps/stickers-web
        run: |
          npm install
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "apps/stickers-web/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
