name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          sparse-checkout: apps/stickers-web
      - name: Cache web assets from Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-git-lfs-${{ hashFiles('apps/stickers-web/public/**') }}
          restore-keys: |
            ${{ runner.os }}-git-lfs-
      - name: Pull web assets from Git LFS
        env:
          GIT_LFS_FORCE_PROGRESS: "1"
        run: |
          git config lfs.concurrenttransfers 4
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 5m git lfs pull --include="apps/stickers-web/public/**"; then
              exit 0
            fi
            echo "Git LFS pull attempt ${attempt} failed; retrying with downloaded objects preserved."
          done
          exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: npm install, build, and test
        working-directory: apps/stickers-web
        run: |
          npm install
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "apps/stickers-web/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
